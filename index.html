<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <img src="./moon.png" id="theme">
    <div class="mainBox mainBox1">
      <img src="./drizzle.png" />
      <h1 class="weather">Weather</h1>
      <h2 class="forecast">Forecast</h2>
      <button class="start">Get Start</button>
    </div>
    <div class="mainBox mainBox2 inactive">
      <div class="searchBox">
        <input type="text" placeholder="Enter your city" id="inputfield" />
        <div class="img"><img src="./search.png" id="searchIcon" /></div>
      </div>
      <div class="iconBox">
        <img src="./drizzle.png" class="icon" />
        <p id="desc">Desciption</p>
      </div>
      <div class="tempBox">
        <h1 id="temp">0°C</h1>
        <h3 id="city">Karachi</h3>
      </div>
      <div class="extraDetails">
        <div class="wind">
          <img src="./windy.png" id="windIcon" />
          <div class="windData">
            <p id="windSpeed">0km/h</p>
            <p>wind</p>
          </div>
        </div>
        <div class="humidity">
          <img src="./humidity.png" id="humidityIcon" />
          <div class="humidityData">
            <p id="humidityper">0%</p>
            <p>humidity</p>
          </div>
        </div>
      </div>
    </div>
    <div class="mainBox mainBox3 inactive">
      <img src="./clear.png" class="notfound" />
      <h1>404</h1>
      <div class="text">
        <p class="oops">Oops! Page Not Found</p>
        <br />
        <p id="info" class="message">
          The page you're looking for doesn't exist or has been removed.
        </p>
      </div>
      <button class="goBack">Go Home</button>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
